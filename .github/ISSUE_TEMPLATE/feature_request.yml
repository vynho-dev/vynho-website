name: Change request
description: Propose a focused site, content, or experience improvement.
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem or opportunity
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance criteria
      description: Include affected routes, desktop/mobile behavior, and any SEO, analytics, or accessibility requirements.
