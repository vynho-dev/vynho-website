<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050609" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        try {
          const queryTheme = new URLSearchParams(window.location.search).get('theme')
          const storedTheme = window.localStorage.getItem('vynho-theme')
          const theme = queryTheme === 'light' || queryTheme === 'dark'
            ? queryTheme
            : storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'dark'
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#050609' : '#f4f6fa'
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <title>Vynho | Product Design &amp; Engineering Studio</title>
    <meta name="description" content="Vynho is a founder-led product design and engineering studio in Hyderabad, working globally across websites, apps, SaaS, commerce, and AI systems." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="author" content="Vynho" />

    <meta property="og:title" content="Vynho | Product Design &amp; Engineering Studio" />
