<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050609" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        try {
          const queryTheme = new URLSearchParams(window.location.search).get('theme')
          const storedTheme = window.localStorage.getItem('vynho-theme')
          const theme = queryTheme === 'light' || queryTheme === 'dark'
            ? queryTheme
            : storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'dark'
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#050609' : '#f4f6fa'
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <title>Vynho | Premium SaaS, AI & Product Engineering</title>
    <meta
      name="description"
      content="Vynho is a premium SaaS, AI, web, and mobile product studio delivering conversion-ready design and resilient engineering for ambitious teams."
    />
    <meta property="og:title" content="Vynho | Premium SaaS, AI & Product Engineering" />
    <meta
      property="og:description"
      content="Premium SaaS, AI, web, and mobile product systems designed to build trust, explain value, and convert serious buyers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vynho.com" />
    <link rel="canonical" href="https://vynho.com" />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/vmark-monochrome-white.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Radio+Canada+Big:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
